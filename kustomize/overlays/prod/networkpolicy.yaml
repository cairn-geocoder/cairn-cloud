# Pod-level egress lockdown:
#   * 53/udp + 53/tcp → kube-dns for the bundle hostname resolve
#   * 443/tcp → ANY for the bundle download (init container only —
#     after init, cairn-serve makes no outbound calls; this rule is
#     effectively dormant once the pod is running)
#
# Ingress is allowed from anything matching the ingress controller's
# pod label set. Adjust the `from` clause to your environment — the
# placeholder below matches `app.kubernetes.io/name: ingress-nginx`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cairn
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cairn
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
